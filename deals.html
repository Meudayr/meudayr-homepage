  <style>
    .deals-page-container {
      padding: 40px 0 80px;
    }

    /* Category Navigation Bar Header */
    .category-hero-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      margin-bottom: 32px;
      text-align: center;
      position: relative;
    }

    .category-hero-panel h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3.5vw, 2.3rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .category-hero-panel p {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 560px;
      margin: 0 auto 24px auto;
      line-height: 1.5;
    }

    /* Category Buttons */
    .category-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .category-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .category-btn:hover {
      border-color: var(--card-border-hover);
      color: var(--text-main);
    }

    .category-btn.active {
      background: rgba(56, 142, 60, 0.18);
      border-color: var(--primary);
      color: #81c784;
      box-shadow: 0 4px 14px rgba(56, 142, 60, 0.25);
    }

    /* Section Control Header */
    .deals-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .deals-section-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 0;
    }

    .deals-section-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 10px;
    }

    .rescan-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: var(--radius-md);
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: var(--transition);
    }

    .rescan-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--card-border-hover);
    }

    .rescan-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Filter Bar */
    .filter-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .filter-chip-btn:hover {
      color: var(--text-main);
      border-color: var(--card-border-hover);
    }

    .filter-chip-btn.active-hot {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
      color: #fb7185;
    }

    .filter-chip-btn.active-archive {

      border-color: #38bdf8;

    }

    .chip-segment-group {

      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);

      border: none;
      color: var(--text-muted);

      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--font-sans);

    .segment-btn:hover {

    }

    .segment-btn.active {

      color: #81c784;
    }

    .counter-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Deals Stream */
    .deals-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .deal-card {
      background: var(--card-bg);

      border-radius: var(--radius-lg);

      justify-content: space-between;

      transform: translateY(-2px);
    }

    .deal-main-info {

    }

    .deal-tags {

      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag-badge {

      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);

      color: var(--text-muted);
    }

    .tag-store {

      border-color: rgba(192, 157, 82, 0.25);
      color: var(--accent);
    }

    .tag-source {
      background: rgba(56, 142, 60, 0.12);
      border-color: rgba(56, 142, 60, 0.25);

    }

    }

    .tag-time {

      color: var(--text-dark);

    .deal-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      line-height: 1.45;

    .deal-action-panel {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .deal-upvotes {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);

    .deal-price-wrapper {

    .deal-price {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      color: #4caf50;
      display: block;
    }

    .deal-orig-price {
      font-size: 0.8rem;
      color: var(--text-dark);
      text-decoration: line-through;
      margin-right: 4px;
    }

    .deal-discount {
      font-size: 0.78rem;
      color: #fb7185;
      font-weight: 700;
    }

    .deal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      transition: var(--transition);
      white-space: nowrap;
    }

    .deal-btn:hover {
      background: #43a047;
    }

    .deal-btn.reddit {
      background: #4f46e5;
    }

    .deal-btn.reddit:hover {
      background: #6366f1;
    }

    /* Loading / Empty States */
    .empty-state {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 50px 20px;
      text-align: center;

    .empty-state h3 {
      font-family: var(--font-display);
      color: var(--text-main);

      margin-bottom: 8px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // State management
    let state = {
      selectedCategory: 'gaming_pcs',
      selectedQuery: 'gaming pc',
      allDeals: [],
      filterHotOnly: false,
      includeArchive: false,
      sourceFilter: 'all',
      sortBy: 'hottest', // 'hottest' | 'price-asc' | 'price-desc'
      isLoading: false
    };

    function formatCurrency(val) {
      if (typeof val !== 'number' || isNaN(val) || val <= 0) return '';
      const hasCents = val % 1 !== 0;
      return val.toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: hasCents ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    async function loadDeals() {
      state.isLoading = true;
      renderUI();

      try {
        const deals = await fetchClientSideDeals(state.selectedCategory, state.selectedQuery, state.includeArchive);
        state.allDeals = deals;
      } catch (e) {
        console.error('Error fetching live deals:', e);
        state.allDeals = [];
      }

      state.isLoading = false;
      renderUI();
    }

    async function fetchClientSideDeals(category, query, includeArchive) {
      const SUBREDDITS = {
        gaming_pcs: ['buildapcsales', 'prebuilts'],
        laptops: ['laptopdeals', 'buildapcsales'],
        vacuums: ['deals', 'buildapcsales'],
        tvs: ['buildapcsales', 'deals'],
        consoles: ['GameDeals', 'buildapcsales'],
        appliances: ['deals', 'buildapcsales']
      };

      const SEARCH_QUERIES = {
        gaming_pcs: ['gaming desktop', 'gaming pc'],
        laptops: ['laptop', 'macbook'],
        vacuums: ['vacuum'],
        tvs: ['oled tv', 'gaming monitor', '4k tv'],
        consoles: ['ps5', 'xbox', 'nintendo switch', 'video game'],
        appliances: ['refrigerator', 'washer dryer', 'dishwasher', 'appliance']
      };

      const deals = [];
      const sqList = SEARCH_QUERIES[category] || [query];

      // Fetch Slickdeals
      for (const sq of sqList) {
        try {
          const sdUrl = `https://slickdeals.net/newsearch.php?mode=popdeals&searchmode=4&q=${encodeURIComponent(sq)}&rss=1`;
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(sdUrl)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.items)) {
              data.items.forEach((item, idx) => {
                const title = item.title || '';
                const titleLower = title.toLowerCase();
                if (titleLower.includes('expired') || titleLower.includes('sold out') || titleLower.includes('dead deal')) return;
                
                const { salePrice, originalPrice, discountPercentage } = parseExplicitPricesFromTitle(title);
                const store = detectStoreName(item.content || item.description || '', title, item.link || '');
                const productName = title.split('-')[0].replace(/\[.*?\]/g, '').trim() || title.slice(0, 45);

                deals.push({
                  id: `sd_cs_${idx}_${Math.random().toString(36).substr(2,4)}`,
                  title,
                  productName,
                  store,
                  originalPrice,
                  salePrice,
                  discountPercentage,
                  url: item.link || '',
                  redditThreadUrl: item.link || '',
                  source: 'Slickdeals Active Deal',
                  upvotes: undefined,
                  postedTimeAgo: 'Active Hot Deal',
                  isArchive: false,
                  isHot: discountPercentage > 15 || salePrice > 500
                });
              });
            }
          }
        } catch (e) {}
      }

      // Fetch Subreddits
      const subs = SUBREDDITS[category] || ['buildapcsales', 'deals'];
      for (const sub of subs) {
        try {
          const redditUrl = `https://www.reddit.com/r/${sub}/.rss`;
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(redditUrl)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.status === 'ok' && Array.isArray(data.items)) {
              data.items.forEach((item, idx) => {
                const title = item.title || '';
                const titleLower = title.toLowerCase();
                if (titleLower.includes('weekly request') || titleLower.includes('meta') || titleLower.includes('expired') || titleLower.includes('sold out')) return;

                const { salePrice, originalPrice, discountPercentage } = parseExplicitPricesFromTitle(title);
                const store = detectStoreName(item.content || item.description || '', title, item.link || '');
                const productName = title.split('-')[0].replace(/\[.*?\]/g, '').trim() || title.slice(0, 45);

                deals.push({
                  id: `rd_cs_${sub}_${idx}`,
                  title,
                  productName,
                  store,
                  originalPrice,
                  salePrice,
                  discountPercentage,
                  url: item.link || `https://www.reddit.com/r/${sub}/`,
                  redditThreadUrl: item.link || `https://www.reddit.com/r/${sub}/`,
                  source: `Reddit r/${sub}`,
                  upvotes: undefined,
                  postedTimeAgo: 'Recent Post',
                  isArchive: false,
                  isHot: discountPercentage > 15
                });
              });
            }
          }
        } catch (e) {}
      }

      // Deduplicate
      const seen = new Set();
      return deals.filter(d => {
        const normKey = d.title.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 45);
        if (seen.has(normKey)) return false;
        seen.add(normKey);
        return true;
      });
    }

    function detectStoreName(descText, title, link) {
      const fullText = `${descText} ${title} ${link}`.toLowerCase();
      if (fullText.includes('best buy') || fullText.includes('bestbuy')) return 'Best Buy';
      if (fullText.includes('amazon')) return 'Amazon';
      if (fullText.includes('walmart')) return 'Walmart';
      if (fullText.includes('ebay')) return 'eBay';
      if (fullText.includes('costco')) return 'Costco';
      if (fullText.includes('target')) return 'Target';
      if (fullText.includes("sam's club") || fullText.includes('sams club') || fullText.includes('samsclub')) return "Sam's Club";
      if (fullText.includes('home depot') || fullText.includes('homedepot')) return 'Home Depot';
      if (fullText.includes('lowes') || fullText.includes("lowe's")) return "Lowe's";
      if (fullText.includes('micro center') || fullText.includes('microcenter')) return 'Micro Center';
      if (fullText.includes('newegg')) return 'Newegg';
      if (fullText.includes('lenovo')) return 'Lenovo';
      if (fullText.includes('dell')) return 'Dell';
      if (fullText.includes('hp ') || fullText.includes('hp.com')) return 'HP';
      if (fullText.includes('apple')) return 'Apple Store';
      if (fullText.includes('woot')) return 'Woot!';
      if (fullText.includes('b&h') || fullText.includes('bhphoto')) return 'B&H Photo';
      return 'Retailer Deal';
    }

    function parseExplicitPricesFromTitle(title) {
      const matches = title.match(/\$(\d+(?:,\d{3})*(?:\.\d{1,2})?)/g) || [];
      const numbers = matches.map(m => parseFloat(m.replace('$', '').replace(/,/g, '')));
      if (numbers.length === 0) return { salePrice: 0, originalPrice: 0, discountPercentage: 0 };
      let salePrice = numbers[0];
      let originalPrice = 0;
      if (numbers.length > 1) {
        for (let i = 1; i < numbers.length; i++) {
          if (numbers[i] > salePrice) { originalPrice = numbers[i]; break; }
        }
      }
      let discountPercentage = 0;
      if (originalPrice > salePrice) {
        discountPercentage = Math.round(((originalPrice - salePrice) / originalPrice) * 100);
      } else { originalPrice = 0; }
      return { salePrice, originalPrice, discountPercentage };
    }

    function getProcessedDeals() {
      let list = [...state.allDeals];

      if (state.filterHotOnly) {
        list = list.filter(d => d.isHot);
      }

      if (state.sourceFilter === 'slickdeals') {
        list = list.filter(d => d.source.toLowerCase().includes('slickdeals'));
      } else if (state.sourceFilter === 'reddit') {
        list = list.filter(d => d.source.toLowerCase().includes('reddit'));
      }

      if (state.sortBy === 'price-asc') {
        list.sort((a, b) => a.salePrice - b.salePrice);
      } else if (state.sortBy === 'price-desc') {
        list.sort((a, b) => b.salePrice - a.salePrice);
      } else {
        list.sort((a, b) => {
          const upA = typeof a.upvotes === 'number' ? a.upvotes : 0;
          const upB = typeof b.upvotes === 'number' ? b.upvotes : 0;
          const scoreA = (a.isHot ? 1000 : 0) + (upA * 5) + ((a.discountPercentage || 0) * 3);
          const scoreB = (b.isHot ? 1000 : 0) + (upB * 5) + ((b.discountPercentage || 0) * 3);
          return scoreB - scoreA;
        });
      }

      return list;
    }

    function renderUI() {
      // Subtitle
      document.getElementById('timeframe-subtitle').textContent = state.includeArchive ? '— Last 7 Days' : '— Last 4 Days';

      // Rescan button
      const rescanBtn = document.getElementById('rescan-btn');
      rescanBtn.disabled = state.isLoading;
      rescanBtn.textContent = state.isLoading ? 'Scanning Active Deals...' : 'Re-scan Live Deals';

      // Toggles
      const hotBtn = document.getElementById('btn-hot-only');
      hotBtn.className = `filter-chip-btn ${state.filterHotOnly ? 'active-hot' : ''}`;

      const archBtn = document.getElementById('btn-archive');
      archBtn.className = `filter-chip-btn ${state.includeArchive ? 'active-archive' : ''}`;

      // Source segments
      document.querySelectorAll('.chip-segment-group button[data-source]').forEach(btn => {
        btn.className = `segment-btn ${btn.dataset.source === state.sourceFilter ? 'active' : ''}`;
      });

      // Price Sort buttons
      const sortAscBtn = document.getElementById('btn-sort-asc');
      const sortDescBtn = document.getElementById('btn-sort-desc');
      sortAscBtn.className = `segment-btn ${state.sortBy === 'price-asc' ? 'active' : ''}`;
      sortDescBtn.className = `segment-btn ${state.sortBy === 'price-desc' ? 'active' : ''}`;

      // Container & Counter
      const container = document.getElementById('deals-container');
      const counter = document.getElementById('deal-counter');

      if (state.isLoading) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="spinner"></span>
            <h3 style="margin-top:14px;">Scanning Slickdeals &amp; Reddit for active deals...</h3>
            <p style="font-size:0.88rem;color:var(--text-muted);margin:0;">Parsing live prices, upvote scores, and unexpired threads.</p>
          </div>
        `;
        counter.textContent = 'Scanning live deals...';
        return;
      }

      const displayDeals = getProcessedDeals();
      counter.innerHTML = `Showing <strong>${displayDeals.length}</strong> of ${state.allDeals.length} deals`;

      if (displayDeals.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3 style="color:#ef4444;">No active deals matching your selected filters right now.</h3>
            <p style="font-size:0.88rem;color:var(--text-muted);margin:0;">Try disabling "Hot Deals Only" or enabling "Include 7 Day Archive".</p>
          </div>
        `;
        return;
      }

      container.innerHTML = displayDeals.map(deal => {
        const isSlickdeals = deal.source.toLowerCase().includes('slickdeals');
        const hasExplicitMsrp = deal.originalPrice > deal.salePrice;
        const upvotesNum = typeof deal.upvotes === 'number' ? deal.upvotes : 0;
        const hasUpvotes = typeof deal.upvotes === 'number' && !isNaN(deal.upvotes);

        return `
          <div class="deal-card">
            <div class="deal-main-info">
              <div class="deal-tags">
                <span class="tag-badge tag-store">${deal.store || 'Retailer Deal'}</span>
                <span class="tag-badge tag-source">${deal.source}</span>
                ${deal.postedTimeAgo ? `<span class="tag-time">⏱️ ${deal.postedTimeAgo}</span>` : ''}
                ${deal.isHot ? `<span class="tag-badge tag-hot">🔥 HOT DEAL</span>` : ''}
              </div>
              <h3 class="deal-title">${deal.title}</h3>
            </div>

            <div class="deal-action-panel">
              ${hasUpvotes ? `
                <div class="deal-upvotes" title="Community Upvotes">
                  👍 <span>${upvotesNum}</span>
                </div>
              ` : ''}

              <div class="deal-price-wrapper">
                <span class="deal-price">${deal.salePrice > 0 ? formatCurrency(deal.salePrice) : '<span style="font-size:0.88rem;color:var(--text-muted);font-weight:600;">See Deal</span>'}</span>
                ${hasExplicitMsrp ? `
                  <span class="deal-orig-price">${formatCurrency(deal.originalPrice)}</span>
                  <span class="deal-discount">${deal.discountPercentage}% OFF</span>
                ` : ''}
              </div>

              <a href="${deal.url}" target="_blank" rel="noopener noreferrer" class="deal-btn ${isSlickdeals ? '' : 'reddit'}">
                <span>${isSlickdeals ? 'Open Deal on Slickdeals' : 'Open Deal on Reddit'}</span>
                ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Event Listeners
    document.getElementById('category-bar').addEventListener('click', (e) => {
      const btn = e.target.closest('.category-btn');
      if (!btn) return;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.selectedCategory = btn.dataset.cat;
      state.selectedQuery = btn.dataset.query;
      loadDeals();
    });

    document.getElementById('rescan-btn').addEventListener('click', loadDeals);

    document.getElementById('btn-hot-only').addEventListener('click', () => {
      state.filterHotOnly = !state.filterHotOnly;
      renderUI();
    });

    document.getElementById('btn-archive').addEventListener('click', () => {
      state.includeArchive = !state.includeArchive;
      loadDeals();
    });

    document.querySelectorAll('.chip-segment-group button[data-source]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.sourceFilter = btn.dataset.source;
        renderUI();
      });
    });

    document.getElementById('btn-sort-asc').addEventListener('click', () => {
      state.sortBy = (state.sortBy === 'price-asc') ? 'hottest' : 'price-asc';
      renderUI();
    });

    document.getElementById('btn-sort-desc').addEventListener('click', () => {
      state.sortBy = (state.sortBy === 'price-desc') ? 'hottest' : 'price-desc';
      renderUI();
    });

    // Initial load
    loadDeals();

    // Plex Status Checker
    const PLEX_TOKEN = "ypFBiUJSYfzyDDivAGhu";
    async function checkPlexStatus() {
      const pill = document.getElementById('nav-plex-link');
      const label = document.getElementById('plex-status-label');
      if (!pill || !label) return;
      if (!PLEX_TOKEN) { pill.className = 'plex-nav-pill offline'; label.textContent = 'Setup Token'; return; }
      try {
        const res = await fetch(`https://plex.tv/api/v2/resources?X-Plex-Token=${encodeURIComponent(PLEX_TOKEN)}&includeHttps=1`, {
          headers: { 'Accept': 'application/json', 'X-Plex-Client-Identifier': 'meudayr-homepage' }
        });
        if (res.ok) {
          const resources = await res.json();
          const server = resources.find(r => r.provides && r.provides.includes('server'));
          if (server && server.presence) {
            pill.className = 'plex-nav-pill online';
            label.textContent = 'Online';
            pill.setAttribute('title', `Plex Server: ${server.name || 'Online'}`);
            return;
          }
        }
      } catch (err) {}
      pill.className = 'plex-nav-pill offline';
      label.textContent = 'Offline';
    }
    checkPlexStatus();
  </script>
