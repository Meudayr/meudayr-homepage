name: Sync WarcraftLogs Backup

on:
  schedule:
    - cron: '0 4 * * *'   # Daily backup at 4:00 AM UTC (midnight EDT)
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: fetch-warcraftlogs
  cancel-in-progress: false

jobs:
  sync-logs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Edge Refresh & Backup Logs
        run: |
          echo "Triggering Cloudflare Edge refresh..."
          curl -f -s -X POST https://meudayr.com/api/refresh || true
          echo "Downloading latest logs to data/logs.json..."
          curl -s https://meudayr.com/api/logs -o data/logs.json

      - name: Commit and Push logs.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logs.json
          if git diff --staged --quiet; then
            echo "No changes to logs.json, skipping commit."
          else
            git commit -m "chore: backup logs.json"
            git pull --rebase origin main || true
            git push
          fi
