name: Daily Roster Snapshot Backup

on:
  schedule:
    - cron: '0 10 * * *'  # Runs every morning at 10:00 AM UTC (6:00 AM EDT / 3:00 AM PDT)
  workflow_dispatch:     # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: backup-roster
  cancel-in-progress: false

jobs:
  snapshot-roster:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Take Roster Snapshot
        run: node scripts/backup-roster.js

      - name: Commit and Push Snapshot if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forever-roster.json data/backups/
          if git diff --staged --quiet; then
            echo "No changes in roster snapshot, skipping commit."
          else
            git commit -m "chore: automated daily roster snapshot [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
