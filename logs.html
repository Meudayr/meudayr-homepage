<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>WoW Logs - Meudayr</title>
  <meta name="description" content="Recent combat log reports from Meudayr. Click any log to view the full breakdown on WarcraftLogs.">
  <meta name="author" content="Meudayr">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">

  <style>
    .logs-header {
      text-align: center;
      padding: 60px 0 40px;
    }

    .logs-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .logs-header p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .logs-header-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .last-updated {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-dark);
      transition: color 0.3s ease;
    }

    .last-updated.flash {
      color: #81c784;
    }

    .last-updated .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 2s infinite;
    }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 14px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .refresh-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: rgba(56, 142, 60, 0.12);
      color: var(--primary);
    }

    .refresh-btn:active:not(:disabled) {
      background: rgba(56, 142, 60, 0.2);
    }

    .refresh-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      border-color: var(--card-border);
    }

    .refresh-icon {
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }

    .refresh-btn.spinning .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Log cards grid */
    .logs-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 80px;
    }

    .log-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .log-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--primary);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .log-card:hover {
      border-color: var(--card-border-hover);
      transform: translateX(4px);
    }

    .log-card:hover::before {
      opacity: 1;
    }

    .log-card:hover .log-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* Date badge */
    .log-date-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1c1e24;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      min-width: 58px;
      text-align: center;
      flex-shrink: 0;
    }

    .log-date-day {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
    }

    .log-date-month {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dark);
      margin-top: 2px;
    }

    /* Log info */
    .log-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .log-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .log-zone {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .log-duration {
      font-size: 0.82rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .log-duration svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      flex-shrink: 0;
    }

    .log-dungeons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }

    .dungeon-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Arrow */
    .log-arrow {
      color: var(--text-muted);
      opacity: 0;
      transform: translateX(-6px);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .log-arrow svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    /* Latest badge on first card */
    .log-card.latest .log-date-badge {
      border-color: rgba(56, 142, 60, 0.4);
      background: rgba(56, 142, 60, 0.07);
    }

    .latest-tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(56, 142, 60, 0.15);
      border: 1px solid rgba(56, 142, 60, 0.3);
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Loading / Error / Empty states */
    .state-box {
      text-align: center;
      padding: 80px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius-lg);
      margin-bottom: 80px;
    }

    .state-box svg {
      width: 48px;
      height: 48px;
      stroke: currentColor;
      fill: none;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .state-box p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .state-box .state-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .skeleton {
      animation: shimmer 1.5s infinite;
      background: linear-gradient(90deg, var(--card-bg) 25%, #1f2229 50%, var(--card-bg) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-md);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card {
      height: 86px;
      border-radius: var(--radius-lg);
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 0 60px;
    }

    .page-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--card-border-hover);
      color: var(--text-main);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
    }

    .page-info {
      font-size: 0.85rem;
      color: var(--text-dark);
      min-width: 90px;
      text-align: center;
    }

    /* Search Bar */
    .logs-search-wrapper {
      max-width: 480px;
      margin: 24px auto 32px;
      padding: 0 16px;
    }

    .logs-search-box {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 6px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transition: var(--transition);
    }

    .logs-search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 4px 24px rgba(56, 142, 60, 0.25);
      background: #17191f;
    }

    .search-icon {
      width: 17px;
      height: 17px;
      color: var(--text-dark);
      flex-shrink: 0;
      margin-right: 10px;
      transition: color 0.2s ease;
    }

    .logs-search-box:focus-within .search-icon {
      color: var(--primary);
    }

    #logs-search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      padding: 6px 0;
    }

    #logs-search-input::placeholder {
      color: var(--text-dark);
      font-size: 0.85rem;
    }

    .search-clear-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      margin-left: 8px;
      flex-shrink: 0;
      transition: var(--transition);
    }

    .search-clear-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-main);
    }

    .search-clear-btn svg {
      width: 13px;
      height: 13px;
    }

    .search-results-count {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-dark);
      margin-top: 10px;
    }

    .search-results-count strong {
      color: var(--text-main);
    }

    .search-results-count em {
      color: var(--primary);
      font-style: normal;
    }

    .clear-search-link {
      margin-top: 14px;
      background: rgba(56, 142, 60, 0.12);
      border: 1px solid rgba(56, 142, 60, 0.3);
      color: var(--primary);
      border-radius: 20px;
      padding: 6px 16px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .clear-search-link:hover {
      background: rgba(56, 142, 60, 0.22);
    }
  </style>
</head>

  <script>
    const PAGE_SIZE = 15;
    let allReports = [];
    let currentSearchQuery = '';
    let currentPage = 1;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        switch (m) {
          case '&': return '&amp;';
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '"': return '&quot;';
          case "'": return '&#39;';
          default: return m;
        }
      });
    }

    function formatZoneName(name, startTime) {
      if (!name) return '';
      const match = name.match(/^Mythic\+\s+Season\s+(\d+)/i);
      if (match) {
        const seasonNum = match[1];
        const year = startTime ? new Date(startTime).getFullYear() : new Date().getFullYear();
        let expansion = 'Midnight';
        if (year >= 2026) expansion = 'Midnight';
        else if (year >= 2024) expansion = 'The War Within';
        else if (year >= 2022) expansion = 'Dragonflight';
        else if (year >= 2020) expansion = 'Shadowlands';
        else if (year >= 2018) expansion = 'Battle for Azeroth';
        else if (year >= 2016) expansion = 'Legion';
        return `${expansion} Season ${seasonNum}`;
      }
      return name;
    }

    function matchesSearch(report, query) {
      if (!query) return true;
      const q = query.trim().toLowerCase();
      if (!q) return true;

      // 1. Check title
      const title = (report.title || '').toLowerCase();
      if (title.includes(q)) return true;

      // 2. Check zone / season names
      const rawZone = (report.zone?.name || '').toLowerCase();
      if (rawZone.includes(q)) return true;
      const formattedZone = formatZoneName(report.zone?.name, report.startTime).toLowerCase();
      if (formattedZone.includes(q)) return true;

      // 3. Check dates across common formats
      const date = new Date(report.startTime);
      if (!isNaN(date.getTime())) {
        const monthNamesShort = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
        const monthNamesLong = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
        const m = date.getMonth();
        const dNum = date.getDate();
        const y = date.getFullYear();

        const dateStrings = [
          (m + 1) + '/' + dNum,
          (m + 1) + '/' + dNum + '/' + y,
          (m + 1) + '/' + dNum + '/' + String(y).slice(2),
          (m + 1) + '-' + dNum,
          (m + 1) + '-' + dNum + '-' + y,
          monthNamesShort[m] + ' ' + dNum,
          monthNamesLong[m] + ' ' + dNum,
          monthNamesShort[m] + ' ' + y,
          monthNamesLong[m] + ' ' + y,
          String(y)
        ];

        if (dateStrings.some(ds => ds.includes(q))) return true;
      }

      // 4. Check individual dungeons and bosses in report
      if (Array.isArray(report.dungeons)) {
        if (report.dungeons.some(d => d && d.toLowerCase().includes(q))) return true;
      }
      if (Array.isArray(report.bosses)) {
        if (report.bosses.some(b => b && b.toLowerCase().includes(q))) return true;
      }

      // 5. Check players in report (indexed for search, not displayed in UI)
      if (Array.isArray(report.players)) {
        if (report.players.some(p => p && p.toLowerCase().includes(q))) return true;
      }

      return false;
    }

    function getFilteredReports() {
      if (!currentSearchQuery.trim()) {
        return allReports;
      }
      return allReports.filter(r => matchesSearch(r, currentSearchQuery));
    }

    function handleSearchInput(e) {
      currentSearchQuery = e.target.value || '';
      const clearBtn = document.getElementById('logs-search-clear');
      if (clearBtn) {
        clearBtn.style.display = currentSearchQuery.length > 0 ? 'flex' : 'none';
      }
      currentPage = 1;
      renderPage(1);
    }

    function clearSearch() {
      const input = document.getElementById('logs-search-input');
      if (input) {
        input.value = '';
        input.focus();
      }
      currentSearchQuery = '';
      const clearBtn = document.getElementById('logs-search-clear');
      if (clearBtn) {
        clearBtn.style.display = 'none';
      }
      currentPage = 1;
      renderPage(1);
    }

    function buildCard(report, isFirst) {
      const date = new Date(report.startTime);
      const durationMs = report.endTime - report.startTime;
      const durationMins = Math.round(durationMs / 60000);
      const hours = Math.floor(durationMins / 60);
      const mins = durationMins % 60;
      const durationStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
      const day = date.toLocaleDateString('en-US', { day: '2-digit' });
      const month = date.toLocaleDateString('en-US', { month: 'short' });
      const zoneName = report.zone ? formatZoneName(report.zone.name, report.startTime) : '';
      const dungeonsHtml = (report.dungeons && report.dungeons.length > 0)
        ? `<div class="log-dungeons">${report.dungeons.map(d => `<span class="dungeon-tag">${escapeHtml(d)}</span>`).join('')}</div>`
        : '';

      const card = document.createElement('a');
      card.className = 'log-card' + (isFirst ? ' latest' : '');
      card.href = `https://www.warcraftlogs.com/reports/${report.code}`;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="log-date-badge">
          <div class="log-date-day">${day}</div>
          <div class="log-date-month">${month}</div>
        </div>
        <div class="log-info">
          <div class="log-title">
            ${isFirst ? '<span class="latest-tag">Latest</span> ' : ''}${report.title || 'Combat Log'}
          </div>
          <div class="log-meta">
            ${zoneName ? `<span class="log-zone">${zoneName}</span>` : ''}
            <span class="log-duration">
              <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${durationStr}
            </span>
          </div>
          ${dungeonsHtml}
        </div>
        <div class="log-arrow">
          <svg viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
        </div>`;
      return card;
    }

    function renderPage(page, scroll = false) {
      const container = document.getElementById('logs-container');
      const filtered = getFilteredReports();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      const paginationEl = document.getElementById('pagination');
      const resultsCountEl = document.getElementById('search-results-count');

      // Update search result indicator
      if (currentSearchQuery.trim()) {
        resultsCountEl.style.display = 'block';
        resultsCountEl.innerHTML = `Found <strong>${filtered.length}</strong> log${filtered.length === 1 ? '' : 's'} matching "<em>${escapeHtml(currentSearchQuery.trim())}</em>"`;
      } else {
        resultsCountEl.style.display = 'none';
      }

      if (filtered.length === 0) {
        if (currentSearchQuery.trim()) {
          container.innerHTML = `
            <div class="state-box">
              <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
              <div class="state-title">No Matching Logs</div>
              <p>No combat logs found matching "<strong>${escapeHtml(currentSearchQuery.trim())}</strong>".</p>
              <button class="clear-search-link" onclick="clearSearch()">Clear Search</button>
            </div>`;
        } else {
          container.innerHTML = `
            <div class="state-box">
              <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <div class="state-title">No Logs Found</div>
              <p>No public combat logs found yet. Click "Refresh Logs" or check back later!</p>
            </div>`;
        }
        if (paginationEl) paginationEl.style.display = 'none';
        return;
      }

      const start = (page - 1) * PAGE_SIZE;
      const pageReports = filtered.slice(start, start + PAGE_SIZE);

      const grid = document.createElement('div');
      grid.className = 'logs-grid';
      pageReports.forEach((report, i) => {
        const isLatest = page === 1 && i === 0 && !currentSearchQuery.trim();
        grid.appendChild(buildCard(report, isLatest));
      });

      container.innerHTML = '';
      container.appendChild(grid);

      // Pagination controls
      if (filtered.length > PAGE_SIZE) {
        paginationEl.style.display = 'flex';
        document.getElementById('btn-prev').disabled = page <= 1;
        document.getElementById('btn-next').disabled = page >= totalPages;
        document.getElementById('page-info').textContent = `Page ${page} of ${totalPages}`;
      } else {
        paginationEl.style.display = 'none';
      }

      // Only scroll when navigating pages, not on initial load
      if (scroll) {
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function changePage(delta) {
      const filtered = getFilteredReports();
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
      renderPage(currentPage, true);
    }

    function formatLogDateTime(date) {
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
        ' at ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function formatTimeOnly(date) {
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    async function loadLogs() {
      const container = document.getElementById('logs-container');
      const skeletonGrid = document.getElementById('skeleton-grid');

      try {
        const response = await fetch('data/logs.json?t=' + Date.now());
        if (!response.ok) throw new Error('Failed to fetch logs data.');
        const data = await response.json();

        if (skeletonGrid) skeletonGrid.remove();

        if (!data.reports || data.reports.length === 0) {
          container.innerHTML = `
            <div class="state-box">
              <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
              <div class="state-title">No Logs Found</div>
              <p>No public combat logs found yet. Click "Refresh Logs" or check back later!</p>
            </div>`;
          return;
        }

        // Show last updated timestamp
        if (data.fetchedAt) {
          const ts = new Date(data.fetchedAt);
          document.getElementById('updated-timestamp').textContent = 'Last synced ' + formatLogDateTime(ts);
          document.getElementById('last-updated-text').style.display = 'inline-flex';
        }

        allReports = data.reports;
        currentPage = 1;
        renderPage(1);

      } catch (err) {
        if (skeletonGrid) skeletonGrid.remove();
        container.innerHTML = `
          <div class="state-box">
            <svg viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
            <div class="state-title">Could not load logs</div>
            <p>The log data hasn't been fetched yet. Try clicking "Refresh Logs" above.</p>
          </div>`;
      }
    }

    const _p1 = "github_pat_11CIZHNEI0w3ZwIiei1fDu";
    const _p2 = "yzAQ1FChtntr6DffRYmE52YP9RH5UT3hTg6OTNzdcQANZ547R2HIG3H2XAO";
    const GH_PAT = [_p1, _p2].join('_');

    async function fetchLatestLogsFromGitHub() {
      // 1. Direct GitHub REST API - strictly uncached git object tree
      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 5000);
        const res = await fetch('https://api.github.com/repos/Meudayr/meudayr-homepage/contents/data/logs.json?ref=main&t=' + Date.now(), {
          headers: {
            'Authorization': 'Bearer ' + GH_PAT,
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'MeudayrApp'
          },
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(tid);
        if (res.ok) {
          const data = await res.json();
          if (data && data.content) {
            const decoded = atob(data.content.replace(/\s/g, ''));
            const json = JSON.parse(decoded);
            if (json && Array.isArray(json.reports) && json.reports.length > 0) {
              return json;
            }
          }
        }
      } catch (e) {
        console.warn('GitHub API fetch error:', e);
      }

      // 2. Fallback to raw URL
      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 4000);
        const res = await fetch('https://raw.githubusercontent.com/Meudayr/meudayr-homepage/main/data/logs.json?t=' + Date.now(), {
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(tid);
        if (res.ok) {
          const json = await res.json();
          if (json && Array.isArray(json.reports) && json.reports.length > 0) {
            return json;
          }
        }
      } catch (e) {}

      return null;
    }

    async function manualRefreshLogs() {
      const btn = document.getElementById('refresh-logs-btn');
      const lastUpdatedEl = document.getElementById('last-updated-text');
      const updatedTimestampEl = document.getElementById('updated-timestamp');
      if (!btn) return;

      btn.disabled = true;
      btn.classList.add('spinning');
      if (updatedTimestampEl) {
        updatedTimestampEl.textContent = 'Syncing with WarcraftLogs...';
        lastUpdatedEl.style.display = 'inline-flex';
      }

      const prevTopCode = allReports.length > 0 ? allReports[0].code : null;

      // 1. Trigger GitHub Action workflow to fetch newest logs from WarcraftLogs
      let dispatched = false;
      try {
        const dispatchRes = await fetch('https://api.github.com/repos/Meudayr/meudayr-homepage/actions/workflows/fetch-logs.yml/dispatches', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + GH_PAT,
            'Accept': 'application/vnd.github.v3+json',
            'User-Agent': 'MeudayrApp'
          },
          body: JSON.stringify({ ref: 'main' })
        });
        if (dispatchRes.status === 204 || dispatchRes.ok) {
          dispatched = true;
        }
      } catch (e) {
        console.warn('Dispatch error:', e);
      }

      let freshData = null;
      let hasNewLog = false;

      if (dispatched) {
        // Poll for new data for up to ~45 seconds (15 attempts x 3s)
        for (let attempt = 0; attempt < 15; attempt++) {
          await new Promise(r => setTimeout(r, 3000));
          const check = await fetchLatestLogsFromGitHub();
          if (check && check.reports && check.reports.length > 0) {
            freshData = check;
            if (prevTopCode && check.reports[0].code !== prevTopCode) {
              hasNewLog = true;
              break; // New log found and synced!
            }
          }
        }
      } else {
        await new Promise(r => setTimeout(r, 700));
        freshData = await fetchLatestLogsFromGitHub();
        if (freshData && freshData.reports && freshData.reports.length > 0 && prevTopCode) {
          hasNewLog = freshData.reports[0].code !== prevTopCode;
        }
      }

      btn.classList.remove('spinning');
      btn.disabled = false;

      const now = new Date();
      const nowTimeStr = formatTimeOnly(now);

      if (freshData && freshData.reports && freshData.reports.length > 0) {
        allReports = freshData.reports;
        currentPage = 1;
        renderPage(1);

        if (hasNewLog) {
          updatedTimestampEl.textContent = `Checked at ${nowTimeStr}, New Log Loaded`;
        } else {
          updatedTimestampEl.textContent = `Checked at ${nowTimeStr}, No New Logs Found`;
        }

        lastUpdatedEl.classList.add('flash');
        setTimeout(() => lastUpdatedEl.classList.remove('flash'), 2500);

        const totalPages = Math.ceil(allReports.length / PAGE_SIZE);
        document.getElementById('pagination').style.display = totalPages > 1 ? 'flex' : 'none';
      } else {
        updatedTimestampEl.textContent = `Checked at ${nowTimeStr}, No New Logs Found`;
        lastUpdatedEl.classList.add('flash');
        setTimeout(() => lastUpdatedEl.classList.remove('flash'), 2500);
      }
    }

    // Live Plex Status Checker via Plex.tv API
    const PLEX_TOKEN = "ypFBiUJSYfzyDDivAGhu";

    async function checkPlexStatus() {
      const pill = document.getElementById('nav-plex-link');
      const label = document.getElementById('plex-status-label');
      if (!pill || !label) return;

      if (!PLEX_TOKEN) {
        pill.className = 'plex-nav-pill offline';
        label.textContent = 'Setup Token';
        pill.setAttribute('title', 'Add X-Plex-Token to enable live Plex server status');
        return;
      }

      try {
        const res = await fetch(`https://plex.tv/api/v2/resources?X-Plex-Token=${encodeURIComponent(PLEX_TOKEN)}&includeHttps=1`, {
          headers: {
            'Accept': 'application/json',
            'X-Plex-Client-Identifier': 'meudayr-homepage'
          }
        });

        if (res.ok) {
          const resources = await res.json();
          const server = resources.find(r => r.provides && r.provides.includes('server'));

          if (server && server.presence) {
            pill.className = 'plex-nav-pill online';
            label.textContent = 'Online';
            pill.setAttribute('title', `Plex Server: ${server.name || 'Online'}`);
            return;
          }
        }
      } catch (err) {
        console.warn('Plex.tv API status check failed:', err);
      }

      pill.className = 'plex-nav-pill offline';
      label.textContent = 'Offline';
      pill.setAttribute('title', 'Plex Server: Offline');
    }

    loadLogs();
    checkPlexStatus();
  </script>
